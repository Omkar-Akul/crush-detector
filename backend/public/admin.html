<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrushDetector Admin | Identity Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF1493;
            --primary-light: #FF6B9D;
            --bg: #0f0c29;
            --card-bg: #1a1a2e;
            --text: #ffffff;
            --text-dim: #a0a0c0;
            --success: #00c853;
            --error: #ff3d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 24px; font-weight: 700; color: var(--primary-light); }
        .stats { font-size: 14px; color: var(--text-dim); }

        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-color: rgba(255, 20, 147, 0.3);
        }

        .id-image-container {
            width: 100%;
            height: 250px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .id-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .id-image-container:hover .id-image { transform: scale(1.05); }
        
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: var(--primary);
        }

        .card-body { padding: 20px; flex-grow: 1; }
        .user-name { font-size: 18px; font-weight: 600; margin-bottom: 5px; }
        .user-email { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; }
        
        .detail-row { margin-bottom: 10px; font-size: 14px; }
        .detail-label { color: var(--text-dim); margin-right: 8px; }
        .detail-value { font-weight: 500; }

        .social-link {
            color: #00acee;
            text-decoration: none;
            word-break: break-all;
        }

        .card-actions {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: var(--error); color: white; }
        .btn:hover { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-state {
            text-align: center;
            padding: 100px;
            color: var(--text-dim);
            grid-column: 1 / -1;
        }

        /* Modal for full image */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #modal img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💘 CrushDetector Admin</h1>
            <div class="stats" id="pending-count">Loading requests...</div>
        </header>

        <div class="requests-grid" id="grid">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <img id="modal-img" src="" alt="Full ID">
    </div>

    <script src="/admin.js"></script>
</body>
</html>
