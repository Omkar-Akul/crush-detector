<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrushDetector Admin | Identity Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF1493;
            --primary-light: #FF6B9D;
            --bg: #0f0c29;
            --card-bg: #1a1a2e;
            --text: #ffffff;
            --text-dim: #a0a0c0;
            --success: #00c853;
            --error: #ff3d00;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            background: var(--glass);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }
        h1 { font-size: 24px; font-weight: 700; color: var(--primary-light); }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 12px 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section { display: none; }
        .section.active { display: block; }

        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary-light); }

        .id-image-container {
            width: 100%;
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .id-image { width: 100%; height: 100%; object-fit: contain; }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .data-table th, .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            white-space: nowrap;
        }
        .data-table th { background: rgba(255,255,255,0.02); color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .data-table tr:hover { background: rgba(255,255,255,0.03); }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: var(--error); color: white; }
        .btn-delete { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.2); }
        .btn-delete:hover { background: #ff3b30; color: white; }

        .empty-state { text-align: center; padding: 50px; color: var(--text-dim); }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            header { 
                flex-direction: column; 
                text-align: center; 
                gap: 15px; 
                padding: 20px;
            }
            h1 { font-size: 20px; }
            .tabs {
                padding-bottom: 15px;
                margin-bottom: 20px;
            }
            .tab-btn {
                padding: 10px 18px;
                font-size: 14px;
            }
            .requests-grid {
                grid-template-columns: 1fr;
            }
            .card {
                margin-bottom: 15px;
            }
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💘 CrushDetector Admin</h1>
            <div id="stats-summary" style="font-size: 14px; color: var(--text-dim);">System Live</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="verifications">Pending ID Verifications</button>
            <button class="tab-btn" data-target="users">All Users</button>
            <button class="tab-btn" data-target="crushes">All Crushes</button>
            <button class="tab-btn" data-target="matches">Mutual Matches</button>
            <button class="tab-btn" data-target="confessions">User Confessions</button>
        </div>

        <section id="verifications" class="section active">
            <div class="requests-grid" id="verifications-grid">
                <div class="empty-state">Loading verifications...</div>
            </div>
        </section>

        <section id="users" class="section">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr><td colspan="6" class="empty-state">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="crushes" class="section">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>From</th>
                            <th>To</th>
                            <th>Confidence</th>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="crushes-table">
                        <tr><td colspan="6" class="empty-state">Loading crushes...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="matches" class="section">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>User 1</th>
                            <th>User 2</th>
                            <th>Status</th>
                            <th>Matched At</th>
                        </tr>
                    </thead>
                    <tbody id="matches-table">
                        <tr><td colspan="4" class="empty-state">Loading matches...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="confessions" class="section">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Content</th>
                            <th>User</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="confessions-table">
                        <tr><td colspan="6" class="empty-state">Loading confessions...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <img id="modal-img" src="" alt="Full ID">
    </div>

    <script src="/admin.js"></script>
</body>
</html>
